<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECU EKSPERT – Poradnik elektryka samochodowego</title>
<style>
:root{--bg:#0f1216;--card:#181d23;--line:#2a323c;--txt:#e8edf2;--mut:#93a1b0;--acc:#ffb300;--red:#e53935;--grn:#43a047;--blu:#1e88e5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 16px 12px;border-bottom:1px solid var(--line);background:rgba(15,18,22,.96);z-index:5}
@media(min-width:800px){header{position:sticky;top:0}}
h1{margin:0 0 4px;font-size:22px}
h1 span{color:var(--acc)}
.sub{color:var(--mut);font-size:13px}
#q{margin-top:10px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#11161b;color:var(--txt);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);background:#11161b;color:var(--mut);cursor:pointer}
.chip.on{background:var(--acc);color:#111;border-color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ch h2{margin:0;font-size:18px;flex:1}
.tag{font-size:11px;padding:3px 8px;border-radius:6px;background:#26303a;color:var(--mut);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;padding:12px}
.box{background:#12171c;border:1px solid var(--line);border-radius:10px;padding:10px}
.box h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:5px 4px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{width:34px;font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid #0006}
.meters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.meter{width:150px;text-align:center}
.meter .lab{font-size:12px;font-weight:700;margin-bottom:4px}
.meter .nt{font-size:11px;color:var(--mut);margin-top:2px}
ul.tips{margin:0;padding-left:18px;font-size:13.5px}
ul.tips li{margin:3px 0}
.warn{margin:0 12px 12px;padding:8px 10px;border-left:3px solid var(--acc);background:#1f2125;font-size:12.5px;color:#cfd6dd}
.intro{padding:14px}
.intro p{margin:6px 0;color:#cfd6dd}
.test{border-color:#3d5a2a}
.test h3{color:#7bd34f}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-top:8px}
.bad{background:#2a1717;border-radius:8px;padding:8px}
.bad b{color:#ff8a80}
.ok{background:#16261a;border-radius:8px;padding:8px}
.ok b{color:#9be27a}
ol.tips{padding-left:20px}
.dzial{display:flex;align-items:baseline;gap:10px;margin:26px 2px 4px;padding:10px 14px;border-radius:10px;background:linear-gradient(90deg,#ffb300,#ff8f00);color:#111;scroll-margin-top:12px}
.dzial span{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.dzial small{font-size:12px;opacity:.75}
.card{scroll-margin-top:12px}
#gora{position:fixed;right:14px;bottom:18px;z-index:9;padding:10px 14px;border-radius:24px;border:0;background:#ffb300;color:#111;font-weight:700;font-size:14px;box-shadow:0 4px 14px #0008;cursor:pointer}
@media(min-width:800px){.dzial{scroll-margin-top:190px}.card{scroll-margin-top:190px}}
.toprow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.lang button{background:#11161b;color:var(--mut);border:0;padding:7px 11px;font-weight:700;cursor:pointer}
.lang button.on{background:var(--acc);color:#111}
.aktbtn{margin-left:8px;padding:5px 10px;border-radius:8px;background:#1e88e5;color:#fff;text-decoration:none;font-weight:700;font-size:12px}
.nowa{margin-top:8px;padding:8px 10px;border-radius:8px;background:#1e3a5f;color:#fff;font-size:13px;font-weight:600}
.srow{display:flex;align-items:center;gap:8px}
.srow input{flex:1}
#sinfo{font-size:12px;color:var(--mut);white-space:nowrap;margin-top:10px}
mark.hl{background:#ffe08a;color:#111;border-radius:2px;padding:0 1px}
section.card.trafiony{border-color:#ff6d00;box-shadow:0 0 0 2px #ff6d00}
section.card.trafiony h2 mark.hl{background:#ff6d00;color:#fff}
#snav{position:fixed;left:14px;bottom:18px;z-index:9;display:none;align-items:center;gap:4px;background:#1f252c;border:1px solid var(--line);border-radius:24px;padding:4px 6px;box-shadow:0 4px 14px #0008}
#snav button{background:#2b333c;color:#fff;border:0;border-radius:50%;width:34px;height:34px;font-size:14px;cursor:pointer}
#snc{font-size:13px;color:#fff;padding:0 6px;min-width:44px;text-align:center}
.psrc{margin-top:8px;font-size:11.5px;color:#93a1b0}
@keyframes wscroll{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@keyframes wsweep{0%{transform:translateX(0)}75%,100%{transform:translateX(var(--dx))}}
.wscroll{animation:wscroll 4s linear infinite}
.wsweep{animation:wsweep 5s linear infinite}
.conn{margin-top:4px}
@keyframes wire{to{stroke-dashoffset:-16}}
.wire{stroke-dasharray:6 4;animation:wire .8s linear infinite}
@keyframes tip{0%,100%{transform:translateY(-6px)}40%,70%{transform:translateY(0)}}
.tip{animation:tip 2.4s ease-in-out infinite}
.tip.b{animation-delay:.4s}
@keyframes glow{0%,30%{opacity:0}45%,70%{opacity:1}100%{opacity:0}}
.glow{animation:glow 2.4s ease-in-out infinite}
.glow.b{animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.wscroll,.wsweep,.wire,.tip,.glow{animation:none}.wsweep{display:none}}
.wm{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.wmb{font-size:12px;padding:6px 10px;border-radius:8px;border:1px solid #2f5a3c;background:#0d1a12;color:#8fd6a3;cursor:pointer;font-weight:600}
.wmb.on{background:#4cff7a;color:#06120b;border-color:#4cff7a}
.planb{margin-top:8px;padding:7px 12px;border-radius:8px;border:1px solid #6b5a1e;background:#2a2410;color:#ffd666;font-weight:700;font-size:13px;cursor:pointer}
.plg{margin:10px 0 4px;font-weight:800;color:#ffb300;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.pli{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;padding:6px 0;border-top:1px solid var(--line);cursor:pointer}
.pli input{margin-top:3px;width:18px;height:18px;accent-color:#ffb300;flex-shrink:0}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tools .planb{margin-top:0}
#planb{display:none}body.wl #planb{display:inline-block}
.kal{border:1px solid #2a3440;border-radius:10px;padding:10px;margin:8px 0;background:#11161b}.kal h4{margin:0 0 6px;color:#ffb300;font-size:14px}.krow{margin:6px 0;font-size:13.5px;line-height:2}.kal input:not([type=checkbox]),.kal select{background:#0b0f13;color:#e8edf2;border:1px solid #2f3b47;border-radius:6px;padding:4px 6px;width:64px;font-size:13.5px}.kal select{width:auto;max-width:100%}.kres{color:#9be27a;font-size:15px}
.toolb{padding:7px 12px;border-radius:8px;border:1px solid #2b4a6b;background:#10202f;color:#8cc8ff;font-weight:700;font-size:13px;cursor:pointer}
.klist{max-height:55vh;overflow:auto;margin-top:6px}
.kod{padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
.kc{color:#ffb300;font-family:monospace;font-size:14px}
.kp{font-size:12.5px;color:#93a1b0;margin-top:2px}
.gocard{margin-top:6px;padding:5px 10px;border-radius:8px;border:0;background:#ffb300;color:#111;font-weight:700;font-size:12.5px;cursor:pointer}
.soon{display:inline-block;margin-top:6px;font-size:12px;color:#93a1b0;font-style:italic}
.spth{display:block;width:100%;text-align:left;margin:5px 0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#11161b;color:var(--txt);font-size:14px;font-weight:600;cursor:pointer}
.spyt{font-size:16px;font-weight:700;margin:8px 0}
.sodp{display:flex;flex-wrap:wrap;gap:8px}
.sbtn{flex:1;min-width:90px;padding:12px;border-radius:10px;border:0;font-size:15px;font-weight:800;cursor:pointer;background:#2b333c;color:#fff}
.sbtn.tak{background:#2e7d32}.sbtn.nie{background:#c62828}
.swyn{margin:8px 0;padding:10px;border-radius:10px;background:#16261a;font-size:14px}
.snav{display:flex;gap:8px;margin-top:10px}
.snav button{padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#11161b;color:var(--mut);cursor:pointer}
.done{color:#7bd34f;font-size:12px}
.bcars{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-top:8px}
.bcar{text-align:left;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:#11161b;color:var(--txt);font-size:13px;cursor:pointer}
.bcar small{color:var(--mut)}
.bcar.on{border-color:#ffb300;background:#2a2410}
.bcarh{margin:14px 0 6px;font-size:16px;font-weight:800;color:#ffb300}
.bbox{margin:8px 0;padding:8px;border:1px solid var(--line);border-radius:10px;background:#12171c}
.bbn{font-weight:800;font-size:14px}
.btab td{padding:5px 4px}
.btab td.bnr{width:56px;font-family:monospace;font-weight:700;color:#ffb300}
.famp{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-family:monospace;font-size:12.5px}
.famp i{display:inline-block;width:11px;height:16px;border-radius:2px;border:1px solid #0008}
.famp.na{color:var(--mut)}
.bcrumb{margin-top:8px;font-size:13px;color:var(--mut)}
.bstep{background:none;border:0;color:#8cc8ff;text-decoration:underline;cursor:pointer;font-size:13px;padding:2px}
.bpicks{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:8px}
.bpick{display:flex;align-items:center;gap:8px;padding:12px;border-radius:10px;border:1px solid var(--line);background:#11161b;color:var(--txt);font-size:14px;font-weight:700;cursor:pointer;text-align:left}
.bpick:hover{border-color:#ffb300}
.blogo{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#ffb300;color:#111;font-weight:900}
.bimg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:8px 0}
.bloc{display:flex;gap:8px;align-items:center}
.van{width:110px;flex-shrink:0}
@keyframes bpin{0%,100%{r:9;opacity:1}50%{r:12;opacity:.6}}
.bpin{animation:bpin 1.4s ease-in-out infinite}
.bfoto img{width:100%;max-height:320px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#000}
.bfb{display:flex;gap:6px;margin-top:6px}
.fbtn{display:inline-block;margin-top:6px;padding:6px 10px;border-radius:8px;border:1px solid #2b4a6b;background:#10202f;color:#8cc8ff;font-weight:700;font-size:12.5px;cursor:pointer}
.bsch{width:100%;max-width:420px}
.bfz.hl rect:first-child{stroke:#ffb300;stroke-width:2.5}
.btab tr.hl td{background:#3a2f10}
.bsel{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:8px 0}
.bsel label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:700}
.bsel select{padding:9px;border-radius:8px;border:1px solid var(--line);background:#11161b;color:var(--txt);font-size:14px}
.bsel select:disabled{opacity:.45}
.basug{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-height:50vh;overflow:auto}
.bsug{text-align:left;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:#11161b;color:var(--txt);font-size:13.5px;cursor:pointer}
.bsug:hover{border-color:#ffb300}
.soonbox{margin:10px 0;padding:12px;border-radius:10px;background:#1e2a36;font-size:14px}
#ba,#kq,#bbody #bq{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:#11161b;color:var(--txt);font-size:15px;margin-top:6px}
#ba{border-color:#6b5a1e}
.empty{color:var(--mut);text-align:center;padding:30px}
/* --- 3.6: telefon, spis, wróć, jasny motyw, duża czcionka --- */
@media(max-width:799px){.chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex-shrink:0}
 h1{font-size:18px}.toprow{align-items:flex-start}.vbtn{padding:6px 8px}.lang button{padding:7px 9px}
 .meter{width:132px}.grid{padding:8px;gap:8px}.ch h2{font-size:16.5px}.look svg{max-width:220px;margin:0 auto}}
.introd>summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;color:var(--acc)}
.introd>summary::-webkit-details-marker{display:none}
.introd[open]>summary{border-bottom:1px solid var(--line)}
.intro.card{padding:0}.introd>div{padding:10px 14px}
.quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
.quick .q{flex:1 1 140px;background:#0d1a12;border:1px solid #1f3a2a;border-radius:8px;padding:6px 9px}
.quick .q small{display:block;color:var(--mut);font-size:11.5px;line-height:1.25}
.quick .q b{color:#9be27a;font-size:16px;font-family:ui-monospace,Consolas,monospace}
.spis{columns:2 260px;column-gap:18px}
.spis h4{margin:10px 0 4px;color:var(--acc);font-size:13px;break-after:avoid}
.spis a{display:block;padding:5px 2px;color:var(--txt);text-decoration:none;font-size:13.5px;border-bottom:1px solid #1d242c;break-inside:avoid}
.spis a:active,.spis a:hover{color:var(--acc)}
#wroc{position:fixed;left:14px;bottom:18px;z-index:9;padding:10px 14px;border-radius:24px;border:0;background:#1e88e5;color:#fff;font-weight:700;font-size:14px;box-shadow:0 4px 14px #0008;cursor:pointer;display:none}
.vbtn{background:#11161b;color:var(--mut);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer;font-size:14px}
.vbtn.on{background:var(--acc);color:#111;border-color:var(--acc)}
.tright{display:flex;gap:6px;align-items:center;flex-shrink:0}
body.big{zoom:1.18}
body.light{--bg:#f3f5f7;--card:#ffffff;--line:#c9d1d9;--txt:#111418;--mut:#3d4853}
body.light header{background:rgba(243,245,247,.97)}
body.light .box,body.light .kal,body.light .introd{background:#f7f9fb}
body.light .box h3,body.light .kal h4,body.light .introd>summary,body.light .spis h4{color:#b25e00}
body.light h1 span,body.light #wer{color:#b25e00!important}
body.light .chip,body.light .lang button,body.light .vbtn,body.light #q,body.light #ba,body.light #kq,body.light #bbody #bq,body.light .kal input:not([type=checkbox]),body.light .kal select{background:#fff;color:#111}
body.light .chip.on,body.light .lang button.on,body.light .vbtn.on{background:var(--acc);color:#111}
body.light .toolb{background:#e6f0fa;color:#0b4f8a;border-color:#9cc3e6}
body.light .tag{background:#e3e8ed;color:#333}
body.light .tips li,body.light .intro p,body.light td{color:#1c2228}
body.light .quick .q{background:#eaf6ec;border-color:#9fd3a8}body.light .quick .q b,body.light .kres{color:#1b7a2b}
body.light .bad{background:#fdecec!important;color:#5a1010}body.light .ok{background:#e9f7ec!important;color:#0f4a1c}
body.light .spis a{color:#111;border-color:#e1e6eb}
body.light .kp,body.light .sub,body.light .psrc{color:#3d4853}

</style>

<script>
// ---------- wersja i historia zmian (aktualizuj przy każdej zmianie) ----------
const WERSJA="3.6 · 17.11.2026";
const ZMIANY=[
 ["3.6","Wygodniej na telefonie: kategorie w jednym przesuwanym pasku, zasady pomiaru zwinięte, na górze każdej karty szybkie wartości; nowy 📋 Spis kart; przycisk ↩ Wróć po przejściu z kodu / ścieżki / spisu; jasny motyw ☀ (do pracy w słońcu) i większa czcionka A+","Easier on phones: categories in one scrolling bar, measuring rules collapsed, quick values at the top of every card; new 📋 Card list; ↩ Back button after jumping from a code / path / list; light theme ☀ (for sunlight) and larger text A+"],
 ["3.5","Nowe karty: pompa, wtryskiwacz i zbiornik AdBlue (grzałki, temperatura, poziom), czujnik niskiego ciśnienia paliwa, czujnik obrotów turbiny, wentylator chłodnicy, przekaźniki, bezpieczniki (spadek napięcia), masy; nowy przycisk 🧮 Kalkulatory: napięcie ↔ ciśnienie, NTC, spadek napięcia na przewodzie; 16 nowych kodów","New cards: AdBlue pump, injector and tank (heaters, temperature, level), low fuel pressure sensor, turbo speed sensor, radiator fan, relays, fuses (voltage drop), grounds; new 🧮 Calculators button: voltage ↔ pressure, NTC, wire voltage drop; 16 new codes"],

// ---------- rysowanie: multimetr ----------
function meter(m,ex){
  const modeAng={"V⎓":-50,"V~":-20,"Ω":20,"mA":50,"Hz":-80}[m.mode]??0;
  const a=(modeAng-90)*Math.PI/180, px=75+22*Math.cos(a), py=150+22*Math.sin(a);
  const red=m.mode==="mA"?"mA":"VΩHz";
  return `<div class="meter"><div class="lab">${m.label}</div>
  <svg viewBox="0 0 150 240">
   <rect x="8" y="4" width="134" height="200" rx="16" fill="#f2b600"/>
   <rect x="16" y="12" width="118" height="184" rx="10" fill="#262626"/>
   <rect x="24" y="22" width="102" height="54" rx="5" fill="#b9c9a3"/>
   <text class="${/^[0-9]+(\.[0-9]+)?$/.test(String(m.val))?"mmv":""}" data-v="${m.val}" x="118" y="60" text-anchor="end" font-family="monospace" font-size="${String(m.val).length>6?20:26}" font-weight="700" fill="#1b2412">${m.val}</text>
   <text x="118" y="72" text-anchor="end" font-family="monospace" font-size="10" fill="#1b2412">${m.unit}</text>
   <text x="30" y="34" font-family="monospace" font-size="9" fill="#1b2412">${m.mode==="V~"?"AC":m.mode==="V⎓"?"DC":""}</text>
   <circle cx="75" cy="150" r="34" fill="#3a3a3a" stroke="#555"/>
   ${[["Hz",-80],["V⎓",-50],["V~",-20],["Ω",20],["mA",50]].map(([t,g])=>{const r=(g-90)*Math.PI/180;return `<text x="${75+46*Math.cos(r)}" y="${152+46*Math.sin(r)}" text-anchor="middle" font-size="9" fill="${t===m.mode?'#ffb300':'#bbb'}" font-weight="${t===m.mode?700:400}">${t}</text>`}).join("")}
   <circle cx="75" cy="150" r="24" fill="#1d1d1d"/>
   <line x1="75" y1="150" x2="${px}" y2="${py}" stroke="#ffb300" stroke-width="5" stroke-linecap="round"/>
   <circle cx="45" cy="190" r="6" fill="#111" stroke="#777"/><circle cx="105" cy="190" r="6" fill="#111" stroke="#e53935"/>
   <text x="45" y="181" text-anchor="middle" font-size="7" fill="#bbb">COM</text><text x="105" y="181" text-anchor="middle" font-size="7" fill="#bbb">${red}</text>
   <path d="M45 190 C45 225 20 220 18 238" stroke="#111" stroke-width="4" fill="none"/>
   <path d="M105 190 C105 225 130 220 132 238" stroke="#e53935" stroke-width="4" fill="none"/>
  </svg>${ex||""}${m.note?`<div class="nt">${m.note}</div>`:""}</div>`;
}

const EXT={"AKU−":{pl:"AKU −",en:"BAT −"},"KORPUS":{pl:"korpus",en:"body"},"W2":{pl:"przewód 2",en:"wire 2"}};
function conn(pins,pr){
  if(!pins||!pr)return "";
  const [r,b]=pr,ext=[r,b].filter(x=>EXT[x]);const n=pins.length,wC=ext.length?104:136,x0=8,sp=wC/n,cx=i=>x0+sp*(i+.5);
  const pos=k=>{const i=pins.findIndex(q=>q.n===k);if(i>=0)return [cx(i),58];return [130,58]};
  const [rx,ry]=pos(r),[bx,by]=pos(b);
  const wire=(x1,x2,y,c,cl)=>`<path d="M${x1} 0 C${x1} 26 ${x2} 22 ${x2} ${y-10}" stroke="${c}" stroke-width="2.5" fill="none" class="wire ${cl}"/><g class="tip ${cl}"><rect x="${x2-2}" y="${y-14}" width="4" height="10" fill="${c}"/><circle cx="${x2}" cy="${y-3}" r="2.5" fill="#fff"/></g><circle cx="${x2}" cy="${y}" r="10" fill="none" stroke="${c}" stroke-width="2" class="glow ${cl}"/>`;
  return `<div class="conn"><svg viewBox="0 0 150 82">
   <rect x="${x0-4}" y="44" width="${wC+8}" height="28" rx="6" fill="#2b2f35" stroke="#555"/>
   ${pins.map((q,i)=>`<circle cx="${cx(i)}" cy="58" r="${Math.min(9,sp/2-1)}" fill="${PC[q.c]}" stroke="#000"/><text x="${cx(i)}" y="61.5" text-anchor="middle" font-size="9" font-weight="700" fill="${q.c==='ht'||q.c==='ref'?'#111':'#fff'}">${q.n}</text>`).join("")}
   ${ext.length?`<rect x="116" y="46" width="30" height="24" rx="4" fill="#1d2228" stroke="#777"/><text x="131" y="61" text-anchor="middle" font-size="7.5" fill="#ddd">${EXT[ext[0]][lang]}</text>`:""}
   ${wire(45,bx,by,"#9aa3ab","b")}${wire(105,rx,ry,"#e53935","r")}
   <text x="75" y="80" text-anchor="middle" font-size="8" fill="#93a1b0">${lang==="en"?"red":"czerwony"} → ${EXT[r]?EXT[r][lang]:"pin "+r} · COM → ${EXT[b]?EXT[b][lang]:"pin "+b}</text>
  </svg></div>`;
}

function pinout(p){
  const n=p.length,w=Math.max(150,n*34+30),x0=(w-(n-1)*34)/2;
  const svg=`<svg viewBox="0 0 ${w} 74" style="max-width:${w*1.5}px;margin:0 auto 6px">
   <rect x="5" y="10" width="${w-10}" height="54" rx="10" fill="#2b2f35" stroke="#555"/>
   <rect x="${w/2-16}" y="3" width="32" height="10" rx="3" fill="#2b2f35" stroke="#555"/>
   ${p.map((q,i)=>`<circle cx="${x0+i*34}" cy="37" r="12" fill="${PC[q.c]}" stroke="#000"/><text x="${x0+i*34}" y="41" text-anchor="middle" font-size="12" font-weight="700" fill="${q.c==='ht'||q.c==='ref'?'#111':'#fff'}">${q.n}</text>`).join("")}
  </svg>`;
  return svg+`<table>${p.map(q=>`<tr><td><span class="dot" style="background:${PC[q.c]}"></span>${q.n}</td><td><b>${q.f}</b>${q.v?`<br><span style="color:#93a1b0">${q.v}</span>`:""}</td></tr>`).join("")}</table>`;
}

// ---------- rysowanie: przebieg ----------
let WID=0;
function wave(d){
  const W=340,H=170,L=38,R=8,T=12,B=30,pw=W-L-R,ph=H-T-B,id="w"+(WID++);
  const [y0,y1]=d.y, X=t=>L+t*pw, Y=v=>Math.max(T-2,Math.min(T+ph+2,T+ph-(v-y0)/(y1-y0)*ph));
  let g="";
  for(let i=0;i<=10;i++)g+=`<line x1="${X(i/10)}" y1="${T}" x2="${X(i/10)}" y2="${T+ph}" stroke="#1f3a2a"/>`;
  const ticks=d.ticks||[y0,(y0+y1)/2,y1];
  ticks.forEach(v=>{g+=`<line x1="${L}" y1="${Y(v)}" x2="${L+pw}" y2="${Y(v)}" stroke="#1f3a2a"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end" font-size="9" fill="#8fb39b">${v}</text>`});
  const span=d.per?2:1,N=d.per?1200:600;
  const lines=d.s.map(s=>{const pts=[];for(let i=0;i<=N;i++){const t=i/N*span;pts.push(`${X(t).toFixed(1)},${Y(s.f(t%1)).toFixed(1)}`)}
    return `<polyline points="${pts.join(" ")}" fill="none" stroke="${s.c||'#4cff7a'}" stroke-width="1.8" style="filter:drop-shadow(0 0 2px ${s.c||'#4cff7a'})"/>`}).join("");
  const names=d.s.map(s=>s.n?`<text x="${L+pw-4}" y="${Y(s.f(.98))-5}" text-anchor="end" font-size="10" fill="${s.c||'#4cff7a'}">${WD(s.n)}</text>`:"").join("");
  const marks=(d.m||[]).map(([t,txt])=>`<line x1="${X(t)}" y1="${T}" x2="${X(t)}" y2="${T+ph}" stroke="#ffb300" stroke-dasharray="3 3"/><text x="${X(t)+3}" y="${T+10}" font-size="9" fill="#ffb300">${WD(txt)}</text>`).join("");
  const anim=d.per
   ? `<g clip-path="url(#${id})"><g class="wscroll" style="--dx:-${pw}px">${lines}</g></g>`
   : `<g clip-path="url(#${id})">${lines}<g class="wsweep" style="--dx:${pw}px"><rect x="${L}" y="${T}" width="${pw+4}" height="${ph}" fill="#06120b"/><line x1="${L}" y1="${T}" x2="${L}" y2="${T+ph}" stroke="#b6ffc8" stroke-width="2" opacity=".8"/></g></g>`;
  return `<svg viewBox="0 0 ${W} ${H}"><defs><clipPath id="${id}"><rect x="${L}" y="${T}" width="${pw}" height="${ph}"/></clipPath></defs>
   <rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="#06120b"/>${anim}${g}${marks}${names}
   <text x="10" y="${T+ph/2}" font-size="10" fill="#8fb39b" transform="rotate(-90 10 ${T+ph/2})" text-anchor="middle">${d.u}</text>
   <text x="${L+pw/2}" y="${H-8}" font-size="10" fill="#8fb39b" text-anchor="middle">${d.x}</text></svg>`;
}
// pomocnicze funkcje przebiegów
const lerp=(pts)=>t=>{for(let i=1;i<pts.length;i++){if(t<=pts[i][0]){const[a,b]=[pts[i-1],pts[i]];const k=(t-a[0])/(b[0]-a[0]||1);const s=k*k*(3-2*k);return a[1]+(b[1]-a[1])*s}}return pts[pts.length-1][1]};
const nz=(f,a)=>t=>f(t)+a*(Math.sin(t*913)+Math.sin(t*2311))*.5;
const sq=(lo,hi,n,duty,gap)=>t=>{const p=t*n%1, k=Math.floor(t*n); if(gap&&k%gap===gap-1)return lo; return p<duty?hi:lo};

 a1r:{r:["Wpisz kod w wyszukiwarkę – poradnik pokaże opis, przyczyny i kartę czujnika. Zacznij od kodu, który wystąpił pierwszy (freeze frame).","Type the code into the search – the guide shows the description, causes and the sensor card. Start with the code that appeared first (freeze frame)."]},
 a2:{q:["Doładowanie rzeczywiste dochodzi do zadanego (przyspieszanie na 3. biegu, live data)?","Does actual boost reach target (accelerating in 3rd gear, live data)?"],y:"a3",n:"a2b"},
 a2b:{q:["Słychać syk albo jest olej / pęknięcie na wężach intercoolera?","Hissing sound or oil / cracks on intercooler hoses?"],y:"a2r1",n:"a2r2"},
 a2r1:{r:["Nieszczelność dolotu – napraw węże / intercooler, potem sprawdź doładowanie jeszcze raz.","Intake leak – repair hoses / intercooler, then check boost again."],c:"map"},
 a2r2:{r:["Sprawdź sterowanie turbiny (zawór N75 / nastawnik elektryczny, podciśnienie), ruch kierownicy VNT i czujnik MAP (na zapłonie = baro).","Check turbo control (N75 valve / electric actuator, vacuum), VNT vane movement and the MAP sensor (ignition ON = baro)."],c:"vnt"},
 a3:{q:["Przepływ MAF rzeczywisty jest zbliżony do zadanego?","Is actual MAF air flow close to target?"],y:"a4",n:"a3r"},
 a3r:{r:["MAF zaniża albo EGR nie domyka – zrób test odpięcia MAF i test EGR przez MAF.","MAF reads low or EGR doesn't close – do the MAF unplug test and the EGR test via MAF."],c:"maf"},
 a4:{q:["Ciśnienie paliwa rzeczywiste nadąża za zadanym pod obciążeniem?","Does actual fuel pressure follow target under load?"],y:"a5",n:"a4r"},
 a4r:{r:["Spadek ciśnienia paliwa: filtr, pompa wstępna, powietrze, przelewy wtrysków, MPROP / SCV.","Fuel pressure drop: filter, lift pump, air, injector back-leak, MPROP / SCV."],c:"rail"},
 a5:{q:["Różnica ciśnień DPF przy stałych 2500–3000 obr/min jest w normie?","Is DPF differential pressure normal at steady 2500–3000 rpm?"],y:"a5r1",n:"a5r2"},
 a5r1:{r:["Sprawdź korekty wtrysków (IQ), czujnik pedału gazu (S1 / S2), temperaturę cieczy i paliwa (NTC). Rozważ sprzęgło / hamulce.","Check injector corrections (IQ), accelerator pedal sensor (S1 / S2), coolant and fuel temperature (NTC). Consider clutch / brakes."],c:"app"},
 a5r2:{r:["DPF zapchany – przejdź do oceny stanu DPF.","DPF clogged – go to the DPF condition card."],c:"dpf-filtr"}}},
start:{t:["Silnik kręci, ale nie odpala","Engine cranks but won't start"],start:"b1",n:{
 b1:{q:["Live data pokazuje obroty przy rozruchu (ponad ok. 150–200 obr/min)?","Does live data show rpm while cranking (above approx. 150–200 rpm)?"],y:"b2",n:"b1n"},
 b1n:{q:["Napięcie akumulatora przy rozruchu jest powyżej ok. 9,6–10 V?","Is battery voltage above approx. 9.6–10 V while cranking?"],y:"b1r1",n:"b1r2"},
 b1r1:{r:["Brak sygnału obrotów: czujnik CKP, wiązka, koło impulsowe, opiłki na magnesie.","No rpm signal: CKP sensor, wiring, reluctor wheel, filings on the magnet."],c:"ckp-ind"},
 b1r2:{r:["Akumulator, klemy, masy albo rozrusznik – za niskie obroty rozruchu.","Battery, clamps, grounds or starter – cranking speed too low."],c:"aku"},
 b2:{q:["To silnik diesla?","Is it a diesel engine?"],y:"b3",n:"b5"},
 b3:{q:["Ciśnienie w listwie przy rozruchu dochodzi do min. ok. 150–250 bar?","Does rail pressure reach min. approx. 150–250 bar while cranking?"],y:"b4",n:"b3r"},
 b3r:{r:["Brak ciśnienia: paliwo / powietrze w filtrze, pompa wstępna, przelewy wtrysków, MPROP / SCV, czujnik ciśnienia (zapłon = 0,5 V).","No pressure: fuel / air in filter, lift pump, injector back-leak, MPROP / SCV, pressure sensor (ignition = 0.5 V)."],c:"rail"},
 b4:{q:["Świece żarowe działają (zimny silnik) i immobilizer jest odblokowany?","Do glow plugs work (cold engine) and is the immobiliser unlocked?"],y:"b4r1",n:"b4r2"},
 b4r1:{r:["Sprawdź wtryskiwacze (przelewy, sterowanie), kompresję i korelację CKP / CMP.","Check injectors (back-leak, control), compression and CKP / CMP correlation."],c:"hall"},
 b4r2:{r:["Świece / sterownik świec albo blokada immobilizera – sprawdź błędy immo i rezystancję świec.","Glow plugs / glow plug module or immobiliser lock – check immo faults and glow plug resistance."],c:"glow"},
 b5:{q:["Jest iskra / sterowanie cewek (oscyloskop)?","Is there spark / coil control (scope)?"],y:"b6",n:"b5r"},
 b5r:{r:["Sprawdź zasilanie i masę cewek, sterowanie z ECU oraz czujniki CKP / CMP.","Check coil supply and ground, ECU control and CKP / CMP sensors."],c:"coil"},
 b6:{q:["Wtryskiwacze dostają impulsy i jest ciśnienie paliwa?","Do injectors get pulses and is there fuel pressure?"],y:"b6r1",n:"b6r2"},
 b6r1:{r:["Sprawdź kompresję, rozrząd, czujnik temperatury cieczy (zła dawka rozruchowa) i immobilizer.","Check compression, timing, coolant temperature sensor (wrong start fuelling) and immobiliser."],c:"ntc"},
 b6r2:{r:["Sprawdź pompę paliwa, jej przekaźnik i bezpiecznik oraz sterowanie wtryskiwaczy.","Check the fuel pump, its relay and fuse, and injector control."],c:"inj"}}},
dpf:{t:["DPF się zapycha / częste regeneracje","DPF clogging / frequent regenerations"],start:"c1",n:{
 c1:{q:["Na zapłonie różnica ciśnień ≈ 0 mbar, a wężyki są drożne?","At ignition ON is differential pressure ≈ 0 mbar and are the hoses clear?"],y:"c2",n:"c1r"},
 c1r:{r:["Najpierw czujnik różnicy ciśnień i wężyki – dopiero potem oceniaj DPF.","First the differential pressure sensor and hoses – only then judge the DPF."],c:"dpf"},
 c2:{q:["Popiół (ash) w live data jest na limicie?","Is ash in live data at the limit?"],y:"c2r",n:"c3"},
 c2r:{r:["Czyszczenie lub wymiana DPF – regeneracja nie usuwa popiołu.","DPF cleaning or replacement – regeneration does not remove ash."],c:"dpf-filtr"},
 c3:{q:["Silnik dochodzi do temperatury pracy (ok. 90 °C)?","Does the engine reach operating temperature (approx. 90 °C)?"],y:"c4",n:"c3r"},
 c3r:{r:["Termostat albo czujnik temperatury cieczy – bez temperatury regeneracja nie startuje.","Thermostat or coolant temperature sensor – without temperature regeneration won't start."],c:"ntc"},
 c4:{q:["EGR: rzeczywiste = zadane i zawór domyka (test MAF)?","EGR: actual = target and does the valve close (MAF test)?"],y:"c5",n:"c4r"},
 c4r:{r:["EGR zapchany albo nie domyka – więcej sadzy w DPF.","EGR clogged or not closing – more soot in the DPF."],c:"egr"},
 c5:{q:["Korekty wtrysków (IQ) i przepływ MAF są w normie?","Are injector corrections (IQ) and MAF air flow normal?"],y:"c6",n:"c5r"},
 c5r:{r:["Wtryski albo MAF – nadmiar sadzy.","Injectors or MAF – excess soot."],c:"maf"},
 c6:{q:["Czujniki temperatury spalin pokazują realne wartości?","Do exhaust temperature sensors show realistic values?"],y:"c6r1",n:"c6r2"},
 c6r1:{r:["Przyczyna eksploatacyjna: krótkie trasy, przerywane regeneracje, olej z turbiny / zły olej. Zrób regenerację serwisową i obserwuj spadek dP.","Usage cause: short trips, interrupted regenerations, oil from turbo / wrong oil. Run a service regeneration and watch dP drop."],c:"dpf-filtr"},
 c6r2:{r:["Czujnik EGT – regeneracja jest przerywana albo źle sterowana.","EGT sensor – regeneration is interrupted or badly controlled."],c:"egt"}}},
adblue:{t:["Błąd AdBlue / SCR","AdBlue / SCR fault"],start:"d1",n:{
 d1:{q:["Jakość AdBlue (refraktometr) ok. 32,5%?","Is AdBlue quality (refractometer) approx. 32.5%?"],y:"d2",n:"d1r"},
 d1r:{r:["Wymień płyn i przepłucz zbiornik – zły płyn daje błędy sprawności SCR.","Replace the fluid and flush the tank – bad fluid causes SCR efficiency faults."],c:"can"},
 d2:{q:["Pompa AdBlue buduje ciśnienie w teście (tester)?","Does the AdBlue pump build pressure in the test (scan tool)?"],y:"d3",n:"d2r"},
 d2r:{r:["Pompa, filtr pompy, nieszczelne przewody, grzałki (zamarznięty płyn).","Pump, pump filter, leaking lines, heaters (frozen fluid)."],c:"adpompa"},
 d3:{q:["Wtrysk AdBlue nie jest zakrystalizowany i rozpyla w teście dozowania?","Is the AdBlue injector free of crystals and spraying in the dosing test?"],y:"d4",n:"d3r"},
 d3r:{r:["Wtryskiwacz AdBlue – czyszczenie albo wymiana, sprawdź też kryształy w rurze wydechowej.","AdBlue injector – cleaning or replacement, also check crystals in the exhaust pipe."],c:"adwtrysk"},
 d4:{q:["Oba czujniki NOx startują po rozgrzaniu i pokazują wiarygodne wartości?","Do both NOx sensors start after warm-up and show plausible values?"],y:"d4r1",n:"d4r2"},
 d4r1:{r:["Sprawność katalizatora SCR albo temperatura spalin – sprawdź czujniki EGT i katalizator.","SCR catalyst efficiency or exhaust temperature – check EGT sensors and the catalyst."],c:"egt"},
 d4r2:{r:["Czujnik NOx – zasilanie, CAN albo czujnik.","NOx sensor – supply, CAN or the sensor."],c:"can"}}},
dym:{t:["Dym z wydechu","Exhaust smoke"],start:"e1",n:{
 e1:{q:["Jaki kolor dymu?","What colour is the smoke?"],o:[["Czarny","Black","e2"],["Biały","White","e4"],["Niebieski","Blue","e1r"]]},
 e1r:{r:["Spalanie oleju: turbina (uszczelnienia), uszczelniacze zaworowe, pierścienie, odma.","Burning oil: turbo (seals), valve stem seals, piston rings, crankcase breather."]},
 e2:{q:["Doładowanie i przepływ MAF są w normie?","Are boost and MAF air flow normal?"],y:"e3",n:"e2r"},
 e2r:{r:["Za mało powietrza: nieszczelny dolot, turbina, MAF albo otwarty EGR.","Too little air: intake leak, turbo, MAF or EGR stuck open."],c:"maf"},
 e3:{q:["Korekty i przelewy wtrysków są w normie?","Are injector corrections and back-leak normal?"],y:"e3r1",n:"e3r2"},
 e3r1:{r:["Sprawdź czujniki temperatury (cieczy, paliwa) i rozrząd (kąt wtrysku).","Check temperature sensors (coolant, fuel) and timing (injection angle)."],c:"ntc"},
 e3r2:{r:["Wtryskiwacze – za duża dawka albo leją.","Injectors – overfuelling or dripping."],c:"injcr"},
 e4:{q:["Ubywa płynu chłodzącego?","Is coolant being lost?"],y:"e4r",n:"e5"},
 e4r:{r:["Chłodnica EGR albo uszczelka głowicy.","EGR cooler or head gasket."],c:"egr"},
 e5:{q:["Dymi tylko na zimnym silniku?","Smoke only when the engine is cold?"],y:"e5r1",n:"e5r2"},
 e5r1:{r:["Świece żarowe albo czujnik temperatury cieczy (zła dawka na zimno).","Glow plugs or coolant temperature sensor (wrong cold fuelling)."],c:"glow"},
 e5r2:{r:["Wtryski (słabe rozpylanie), kąt wtrysku, kompresja.","Injectors (poor atomisation), injection timing, compression."],c:"injcr"}}}
};

const MORDER=["zap","zimny","cieply","roz","jal","obr","gaz","uboga","bogata","stuk","stoi","wolno","szybko","cykl"];
const WSEL={};
function modeKeys(id){const m=MODES[id];if(!m)return [];const k=Object.keys(m);if(id==="knock")k.push("stuk");else k.push("cykl");return MORDER.filter(x=>k.includes(x))}
function waveFor(d,k){
 const m=MODES[d.id]&&MODES[d.id][k];
 if(!m)return Object.assign({},d.wave,{per:PER.has(d.id)});
 return {u:d.wave.u,y:m.y||d.wave.y,ticks:m.ticks||(m.y?undefined:d.wave.ticks),per:m.per!==false,s:m.s,m:m.m,x:m.x[lang==="en"?1:0]};
}
function waveBox(d){
 const ks=modeKeys(d.id);
 if(!ks.length)return wave(Object.assign({},d.wave,{per:PER.has(d.id)}));
 const k=WSEL[d.id]&&ks.includes(WSEL[d.id])?WSEL[d.id]:(ks.includes("jal")?"jal":ks[0]);WSEL[d.id]=k;
 return `<div class="wm">${ks.map(x=>`<button class="wmb${x===k?" on":""}" data-id="${d.id}" data-k="${x}">${MK[x][lang==="en"?1:0]}</button>`).join("")}</div><div class="wv">${wave(waveFor(d,k))}</div>`;
}

 tips:["Measure resistance with the plug <b>wire disconnected</b> – otherwise you measure together with the control unit.","<b>Never apply 12 V directly</b> to low-voltage plugs (ceramic / PWM, e.g. 4.4–7 V) – they burn out in seconds.","Quick check without removal: current clamp on each plug wire while heating – a cylinder with 0 A = open circuit.","Remove plugs on a warm engine, slowly and with feel – a snapped plug means drilling or taking the head off.","Heating depends on coolant temperature – a bad temperature sensor = no glow."],
 test:{s:["Read codes (P0380, P0670–P0674) and live data: glow control status, coolant temperature.","Resistance of each plug with the wire disconnected – compare cylinders.","Current clamp while heating – each plug draws similar current.","Control unit: supply 30, ground 31 and ECU signal at ignition ON on a cold engine."],w:["plug: open (OL) or clearly different resistance / current than the others","control unit: has supply, ground and ECU signal, but no output voltage"],n:["coolant temperature sensor – ECU thinks the engine is warm and doesn't glow","heavy fuse / relay, wiring, ground","hard starting is also caused by low rail pressure, compression, injectors"]}},

const NTC_T=[[-40,45313],[-30,26114],[-20,15462],[-10,9397],[0,5896],[10,3792],[20,2500],[30,1707],[40,1175],[50,834],[60,596],[70,436],[80,323],[90,243],[100,186],[110,144],[120,113],[130,89]];
function ntcR(t){const a=NTC_T;if(t<=a[0][0])return a[0][1];for(let i=1;i<a.length;i++)if(t<=a[i][0]){const[t0,r0]=a[i-1],[t1,r1]=a[i];return Math.exp(Math.log(r0)+(Math.log(r1)-Math.log(r0))*(t-t0)/(t1-t0))}return a[a.length-1][1]}
function ntcT(r){const a=NTC_T;if(r>=a[0][1])return a[0][0];for(let i=1;i<a.length;i++)if(r>=a[i][1]){const[t0,r0]=a[i-1],[t1,r1]=a[i];return t0+(t1-t0)*(Math.log(r)-Math.log(r0))/(Math.log(r1)-Math.log(r0))}return a[a.length-1][0]}
const KPRE=[
 {k:"rail18",n:["Rail – 0…1800 bar (Bosch RDS, przykład)","Rail – 0…1800 bar (Bosch RDS, example)"],v:[.5,0,4.5,1800],u:"bar"},

 {k:"own",n:["Własne punkty (np. czujnik DPF)","Own points (e.g. DPF sensor)"],v:[.5,0,4.5,100],u:"kPa"}];

function renderKalk(){
 const e=lang==="en",p=KPRE.find(x=>x.k===KSEL)||KPRE[0];
 $("kalkbody").innerHTML=`
 <div class="kal"><h4>${T2("1. Napięcie ↔ ciśnienie (czujnik liniowy)","1. Voltage ↔ pressure (linear sensor)")}</h4>
  <select id="kp_pre">${KPRE.map(x=>`<option value="${x.k}"${x.k===p.k?" selected":""}>${x.n[e?1:0]}</option>`).join("")}</select>
  <div class="krow">${T2("Punkt 1","Point 1")}: <input id="kp_v1" value="${p.v[0]}"> V = <input id="kp_p1" value="${p.v[1]}"> &nbsp; ${T2("Punkt 2","Point 2")}: <input id="kp_v2" value="${p.v[2]}"> V = <input id="kp_p2" value="${p.v[3]}"> <input id="kp_u" value="${p.u}" style="width:70px"></div>
  <div class="krow">${T2("Zmierzone napięcie","Measured voltage")}: <input id="kp_vin" value="1.5"> V → <b id="kp_out1" class="kres"></b></div>

  <div class="kp">${T2("Charakterystyki są przykładowe – zawsze sprawdź dane konkretnego czujnika (dwa punkty z karty katalogowej).","Characteristics are examples – always check the data of the actual sensor (two points from its datasheet).")}</div></div>
 <div class="kal"><h4>${T2("2. Temperatura ↔ rezystancja NTC","2. Temperature ↔ NTC resistance")}</h4>
  <div class="krow">${T2("Temperatura","Temperature")}: <input id="kn_t" value="20"> °C → <b id="kn_o1" class="kres"></b></div>
  <div class="krow">${T2("Rezystancja","Resistance")}: <input id="kn_r" value="323"> Ω → <b id="kn_o2" class="kres"></b></div>
  <div class="kp">${T2("Wg tabeli Bosch NTC (2,5 kΩ przy 20 °C) – typowe czujniki temperatury cieczy i powietrza; inne czujniki mają inną tabelę.","Per Bosch NTC table (2.5 kΩ at 20 °C) – typical coolant and air temperature sensors; other sensors use a different table.")}</div></div>
 <div class="kal"><h4>${T2("3. Spadek napięcia na przewodzie (miedź)","3. Voltage drop on a wire (copper)")}</h4>
  <div class="krow">${T2("Prąd","Current")}: <input id="kd_i" value="20"> A &nbsp; ${T2("Długość","Length")}: <input id="kd_l" value="3"> m &nbsp; ${T2("Przekrój","Cross-section")}: <input id="kd_a" value="2.5"> mm² &nbsp; <label><input type="checkbox" id="kd_2"> ${T2("tam i z powrotem (bez masy na nadwoziu)","there and back (no body ground)")}</label></div>
  <div class="krow">→ <b id="kd_o" class="kres"></b></div>
  <div class="kp">${T2("Zasilanie odbiorników: spadek zwykle do ok. 3–5% (0,4–0,6 V przy 12 V); masy czujników i sterowników – jak najmniej.","Load supply: drop usually up to approx. 3–5% (0.4–0.6 V at 12 V); sensor and ECU grounds – as little as possible.")}</div></div>`;
 calcKalk();
}
function calcKalk(){
 const v1=num("kp_v1"),p1=num("kp_p1"),v2=num("kp_v2"),p2=num("kp_p2"),u=$("kp_u").value,vin=num("kp_vin"),pin=num("kp_pin");
 const k=(p2-p1)/(v2-v1);
 $("kp_out1").textContent=isFinite(vin)&&isFinite(k)?fx(p1+(vin-v1)*k,2)+" "+u:"–";
 $("kp_out2").textContent=isFinite(pin)&&isFinite(k)&&k?fx(v1+(pin-p1)/k,2)+" V":"–";
 const t=num("kn_t"),r=num("kn_r");
 $("kn_o1").textContent=isFinite(t)?fx(ntcR(t),0)+" Ω":"–";
 $("kn_o2").textContent=isFinite(r)&&r>0?fx(ntcT(r),1)+" °C":"–";
 const I=num("kd_i"),Lm=num("kd_l"),A=num("kd_a"),two=$("kd_2").checked;
 const R=.0175*Lm*(two?2:1)/A,dU=I*R;
 $("kd_o").textContent=isFinite(dU)&&A>0?`${T2("spadek","drop")} ${fx(dU,2)} V (${fx(dU/12*100,1)}% ${T2("z","of")} 12 V) · ${T2("rezystancja przewodu","wire resistance")} ${fx(R*1000,1)} mΩ`+(dU/12>.05?" ⚠":" ✔"):"–";
}
document.addEventListener("input",e=>{if(e.target.closest&&e.target.closest("#kalkbody")&&e.target.id!=="kp_pre")calcKalk()});
document.addEventListener("change",e=>{if(e.target.id==="kp_pre"){KSEL=e.target.value;renderKalk()}else if(e.target.id==="kd_2")calcKalk()});

const UI={
 pl:{t:"Poradnik elektryka samochodowego",doc:"ECU EKSPERT – Poradnik elektryka samochodowego",sub:"Osobówki i dostawczaki · pinout · wzorcowe przebiegi · wartości na zapłonie i na biegu jałowym",ver:"Wersja",cn:"co nowego",cnh:"Co nowego",q:"Szukaj: MAF, lambda, rail, NTC, ABS…",akt:"⟳ Aktualizacja",aktr:"Wgraj aktualizację z pliku…",nowa:v=>`🔔 Dostępna nowa wersja ${v} – kliknij „⟳ Aktualizacja”.`,aktinfo:"Aktualizacja… po zakończeniu otworzy się nowe okno – to możesz zamknąć.",all:"Wszystkie",up:"↑ Działy",look:"Wygląd (schemat)",pin:"Pinout – typowy",par:"Parametry live data – orientacyjnie",wave:"Przebieg wzorcowy",mm:"Multimetr – wartości prawidłowe",test:"✔ Test sprawności – zanim wymienisz",w:"Wymień, gdy:",n:"Najpierw sprawdź (to często NIE czujnik):",tips:"Na co uważać",pgen:"Numeracja pinów przykładowa – zależy od producenta, sprawdź schemat auta.",none:q=>`Nie znaleziono „${q}”`,cnt:n=>`${n} ${n===1?"karta":n<5?"karty":"kart"}`,
  intro:`<div class="box"><h3>Zasady pomiaru – zawsze tak samo</h3><ul class="tips">
   <li><b>Masa pewna:</b> czarny przewód na minus akumulatora albo pin masy czujnika – nie na byle śrubę.</li>
   <li><b>Najpierw zasilanie:</b> 5 V ref (4,9–5,1 V) i masa (spadek &lt; 0,1 V względem minusa aku). Bez tego nie ma sensu mierzyć sygnału.</li>
   <li><b>Mierz od tyłu kostki</b> (igły / backprobe), czujnik podłączony. Rezystancję mierz tylko przy odłączonej kostce.</li>
   <li><b>Przebieg ważniejszy niż multimetr:</b> multimetr pokazuje średnią – szybkie zaniki i „dziury” widać tylko na oscyloskopie.</li>
   <li><b>Porównuj z live data</b> (AlfaOBD / MultiECUScan / Texa) – ten sam parametr w sterowniku musi zgadzać się z pomiarem.</li></ul></div>
   <div class="box" style="margin-top:10px"><h3>Zanim cokolwiek wymienisz – 5 kroków</h3><ol class="tips">
   <li><b>Kod + zamrożone dane</b> (freeze frame): przy jakich obrotach, temperaturze, napięciu wystąpił błąd. Kod „sygnał za niski” ≠ „czujnik uszkodzony”.</li>
   <li><b>Zasilanie i masa na kostce</b> pod obciążeniem (czujnik podłączony): 5 V / 12 V i spadek na masie.</li>
   <li><b>Wiązka:</b> ciągłość do ECU (&lt; 1 Ω), brak zwarcia do masy i do +, poruszaj wiązką podczas pomiaru. Kostka: korozja, wypchnięte piny, olej.</li>
   <li><b>Wiarygodność sygnału:</b> porównaj z live data i z drugim czujnikiem tej samej wielkości (np. MAP vs baro, NTC vs IAT na zimnym aucie).</li>
   <li><b>Wymuszenie / symulacja:</b> zmień warunki (pompka, gaz, grzanie, rezystor zamiast NTC) i patrz, czy sygnał reaguje prawidłowo. Dopiero gdy czujnik nie reaguje przy dobrej wiązce – wymiana.</li></ol></div>

   <div class="warn" style="margin:10px 0 0">Wartości to typowe zakresy dla większości aut. Pinout i napięcia różnią się zależnie od producenta i rocznika – przy wątpliwościach sprawdź schemat konkretnego auta.</div>`},
 en:{t:"Car Electrician's Guide",doc:"ECU EKSPERT – Car Electrician's Guide",sub:"Cars and vans · pinout · reference waveforms · values at ignition ON and at idle",ver:"Version",cn:"what's new",cnh:"What's new",q:"Search: MAF, lambda, rail, NTC, ABS…",akt:"⟳ Update",aktr:"Install update from file…",nowa:v=>`🔔 New version ${v} available – click “⟳ Update”.`,aktinfo:"Updating… a new window will open when done – you can close this one.",all:"All",up:"↑ Sections",look:"Appearance (diagram)",pin:"Pinout – typical",par:"Live data parameters – approximate",wave:"Reference waveform",mm:"Multimeter – correct values",test:"✔ Function test – before you replace",w:"Replace when:",n:"Check first (often NOT the sensor):",tips:"Watch out for",pgen:"Pin numbering is an example – it depends on the manufacturer, check the vehicle diagram.",none:q=>`Nothing found for “${q}”`,cnt:n=>`${n} ${n===1?"card":"cards"}`,
  intro:`<div class="box"><h3>Measuring rules – always the same</h3><ul class="tips">
   <li><b>Solid ground:</b> black lead on the battery negative or the sensor ground pin – not on any random bolt.</li>
   <li><b>Supply first:</b> 5 V ref (4.9–5.1 V) and ground (drop &lt; 0.1 V to battery negative). Without this there is no point measuring the signal.</li>
   <li><b>Backprobe the connector</b> (needles), sensor plugged in. Measure resistance only with the connector unplugged.</li>
   <li><b>Waveform beats multimeter:</b> a multimeter shows the average – fast dropouts and “holes” are visible only on a scope.</li>
   <li><b>Compare with live data</b> (AlfaOBD / MultiECUScan / Texa) – the same parameter in the ECU must match your measurement.</li></ul></div>
   <div class="box" style="margin-top:10px"><h3>Before you replace anything – 5 steps</h3><ol class="tips">
   <li><b>Code + freeze frame:</b> at what rpm, temperature, voltage did the fault occur. “Signal too low” ≠ “sensor faulty”.</li>
