name: Zbuduj APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Znajdz projekt Android
        run: |
          S=$(find . -name settings.gradle -not -path './.git/*' | head -1)
          if [ -z "$S" ]; then echo "BRAK FOLDERU ANDROID"; find . -maxdepth 4 -not -path './.git*'; exit 1; fi
          echo "AND=$(dirname "$S")" >> $GITHUB_ENV
      - name: Skopiuj poradnik do aplikacji
        run: |
          mkdir -p "$AND/app/src/main/assets"
          cp poradnik.html "$AND/app/src/main/assets/poradnik.html"
      - name: Buduj
        run: cd "$AND" && gradle assembleDebug --no-daemon
      - name: Nazwij plik
        run: cp "$AND/app/build/outputs/apk/debug/app-debug.apk" ECU-Ekspert-Poradnik.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ECU-Ekspert-Poradnik-APK
          path: ECU-Ekspert-Poradnik.apk
      - name: Opublikuj w Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Poradnik na Androida (kompilacja ${{ github.run_number }})
          files: ECU-Ekspert-Poradnik.apk
          make_latest: true
